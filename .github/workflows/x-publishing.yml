name: Publish queued X articles
on:
  schedule:
    - cron: '30 8,13,16,19 * * *'
      timezone: 'America/New_York'
    - cron: '0 11 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check due X post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Missing CRON_SECRET GitHub Actions secret"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 3 \
            -X POST https://omarreport.com/api/x/publish \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
