name: Publish queued X articles
on:
  schedule:
    # Run candidate slots in both EDT (UTC-4) and EST (UTC-5).
    # The local-time guard ensures only the five Eastern slots publish.
    - cron: '30 12,13,17,18,23 * * *'
    - cron: '0 15,16,20,21 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Eastern publishing slot
        id: slot
        shell: bash
        run: |
          local_time="$(TZ=America/New_York date +%H:%M)"
          case "$local_time" in
            08:30|11:00|13:30|16:00|19:30)
              echo "due=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Skipping: $local_time Eastern is not a publishing slot."
              echo "due=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Publish next eligible article
        if: steps.slot.outputs.due == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Missing CRON_SECRET GitHub Actions secret"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 3 \
            -X POST https://omarreport.com/api/x/publish \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
