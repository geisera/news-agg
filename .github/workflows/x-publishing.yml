name: Publish queued X articles
on:
  schedule:
    # Run candidate slots in both EDT (UTC-4) and EST (UTC-5).
    # The local-time guard ensures only the five Eastern slots publish.
    - cron: '30 12,13,17,18,23 * * *'
    - cron: '0 15,16,20,21 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Eastern publishing slot
        id: slot
        shell: bash
        run: |
          local_time="$(TZ=America/New_York date +%H:%M)"
          # GitHub scheduled workflows can start late. Accept a 45-minute
          # window after each intended publishing slot, not just its exact minute.
          local_hour="$(TZ=America/New_York date +%H)"
          local_minute="$(TZ=America/New_York date +%M)"
          now_minutes=$((10#$local_hour * 60 + 10#$local_minute))
          due=false
          for slot in 510 660 810 960 1170; do
            if (( now_minutes >= slot && now_minutes < slot + 45 )); then
              due=true
              break
            fi
          done
          if [ "$due" = false ]; then
            echo "Skipping: $local_time Eastern is outside the publishing windows."
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - name: Publish next eligible article
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.due == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Missing CRON_SECRET GitHub Actions secret"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 3 \
            -X POST https://omarreport.com/api/x/publish \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
