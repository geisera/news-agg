name: Publish queued X articles
on:
  schedule:
    # Five runs daily. UTC mapping follows EDT March-October and EST November-February.
    - cron: '30 12,17,23 * 3-10 *'
    - cron: '0 15,20 * 3-10 *'
    - cron: '30 13,18 * 11,12,1,2 *'
    - cron: '0 16,21 * 11,12,1,2 *'
    - cron: '30 0 * 11,12,1,2 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish next eligible X article
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Missing CRON_SECRET GitHub Actions secret"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 3 \
            -X POST https://omarreport.com/api/x/publish \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
