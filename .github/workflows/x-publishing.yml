name: Publish queued X articles
on:
  schedule:
    # Five daily Eastern publishing opportunities. UTC offsets switch by season.
    # March and November include both UTC offsets to cover DST transitions.
    - cron: '30 12,17,23 * 4-10 *'
    - cron: '0 15,20 * 4-10 *'
    - cron: '30 13,18 * 12,1,2 *'
    - cron: '0 16,21 * 12,1,2 *'
    - cron: '30 0 * 12,1,2 *'
    - cron: '30 12,13,17,18,23 * 3,11 *'
    - cron: '0 15,16,20,21 * 3,11 *'
    - cron: '30 0 * 3,11 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish next eligible X article
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Missing CRON_SECRET GitHub Actions secret"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 3 \
            -X POST https://omarreport.com/api/x/publish \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
